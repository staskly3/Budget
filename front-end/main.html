<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>калькулятор доходов</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="introduce">
        <h1 class="title"> Калькулятор доходов/расходов</h1>                <!-- тут короче то что стоит сверху + инфа, короче это начальная хуйня на страничке -->пш
    </div>

    <div class="income-balance-expenses">
       <h2 id="balance" class="balance"> Ваш баланс: </h2>
        <h2 id="income" class="income"> Ваш доход: </h2>
        <h2 id="expenses" class="expenses"> Ваши затраты: </h2>                                  <!-- это баланс вся эта хуйня -->
    </div>

    <div class="incomeAndStuff">  <!-- это указать расходы, доходы, и балик -->
        <div class="tranzaktionAdd">
            <label for="addTranzaktion"> Добавить транзакцию </label>
            <select id="addTranzaktion">
            <option class="income">Доход</option><!-- это список для выбора между доходом и расходом -->
            <option class="expenses">Расход</option>
        </select>
        </div>

        <div class="pickCategory">
        <label for="category"> Выберите категорию <br> </label>
            <select id="category">
                <option> Еда </option>
                <option> Развлечения </option>  <!-- здесь выбирать категорию расходов -->
                <option> Одежда </option>
                <option> Транспорт</option>
                <option> Другое </option>
            </select>

        </div>

        <div class="sum-input">
            <label for="sumInput"> Введите сумму </label>
            <input id="sumInput" type="number">    <!-- это ввод суммы -->
        </div>

        <div class="btnContainer">
            <button id="addBtn"> Добавить </button> <!-- это контейнер для кнопки чтоб передвинуть ее -->
        </div>

    </div>

        
<script>

</script>
</body>
</html>
